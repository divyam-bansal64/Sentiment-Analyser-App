stages:
  data_ingestion:
    cmd: python capstone_src/data/data_ingestion.py
    deps:
      - capstone_src/data/data_ingestion.py
      - capstone_src/constants/__init__.py
    params:
      - data_ingestion.test_size
    outs:
      - data/raw/train.csv
      - data/raw/test.csv

  data_preprocessing:
    cmd: python capstone_src/data/data_preprocessing.py
    deps:
      - data/raw/train.csv
      - data/raw/test.csv
      - capstone_src/data/data_preprocessing.py
      - capstone_src/constants/__init__.py
    outs:
      - data/interim/train_processed.csv
      - data/interim/test_processed.csv

  feature_engineering:
    cmd: python capstone_src/features/feature_engineering.py
    deps:
      - data/interim/train_processed.csv
      - data/interim/test_processed.csv
      - capstone_src/features/feature_engineering.py
      - capstone_src/constants/__init__.py
    params:
      - feature_engineering.max_features
      - feature_engineering.ngram_range
      - feature_engineering.sublinear_tf
    outs:
      - data/processed/train_tfidf.npz
      - data/processed/test_tfidf.npz
      - data/processed/train_labels.npy
      - data/processed/test_labels.npy
      - models/vectorizer.pkl

  model_building:
    cmd: python capstone_src/modeling/model_building.py
    deps:
      - data/processed/train_tfidf.npz
      - data/processed/train_labels.npy
      - capstone_src/modeling/model_building.py
      - capstone_src/constants/__init__.py
    params:
      - model_building.C
      - model_building.max_iter
    outs:
      - models/model.pkl

  model_evaluation:
    cmd: python capstone_src/modeling/model_evaluation.py
    deps:
      - models/model.pkl
      - data/processed/test_tfidf.npz
      - data/processed/test_labels.npy
      - capstone_src/modeling/model_evaluation.py
      - capstone_src/constants/__init__.py
    metrics:
      - reports/metrics.json:
          cache: false
    outs:
      - reports/experiment_info.json

  model_registration:
    cmd: python capstone_src/modeling/register_model.py
    deps:
      - reports/experiment_info.json
      - capstone_src/modeling/register_model.py
      - capstone_src/constants/__init__.py
